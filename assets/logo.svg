<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <!-- Border Gradient -->
    <linearGradient id="appBorderGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="35%" stop-color="#6366f1" />
      <stop offset="70%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Outer Glow Filter -->
    <filter id="borderGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#6366f1" flood-opacity="0.45" />
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#10b981" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Outer Rounded Card with Gradient Border -->
  <rect x="8" y="8" width="104" height="104" rx="26" fill="#030712" stroke="url(#appBorderGrad)" stroke-width="4" filter="url(#borderGlow)" />

  <!-- Inner Dark Background -->
  <rect x="10" y="10" width="100" height="100" rx="24" fill="#090d16" />

  <!-- Left: Lucide Database Icon in Blue/Indigo (#60a5fa) -->
  <g transform="translate(24, 36) scale(1.4)" stroke="#60a5fa" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <ellipse cx="12" cy="5" rx="9" ry="3"/>
    <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/>
    <path d="M3 12c0 1.66 4 3 9 3s9-1.34 9-3"/>
  </g>

  <!-- Right: Lucide Sparkles Icon in Emerald (#34d399) -->
  <g transform="translate(62, 34) scale(1.35)" stroke="#34d399" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Main 4-point star -->
    <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/>
    <!-- Top-left sparkle cross -->
    <path d="M5 3v4"/>
    <path d="M3 5h4"/>
    <!-- Bottom-right sparkle cross -->
    <path d="M19 17v4"/>
    <path d="M17 19h4"/>
  </g>
</svg>
