<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Background & Border Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Squircle Container -->
  <rect x="15" y="15" width="170" height="170" rx="42" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4.5" />

  <!-- Database Stack (Layer 1 - Top) -->
  <ellipse cx="100" cy="65" rx="45" ry="16" fill="#1e293b" stroke="url(#glowGrad)" stroke-width="3" />
  <ellipse cx="100" cy="65" rx="35" ry="11" fill="#0f172a" opacity="0.8" />

  <!-- Database Stack (Layer 2 - Middle) -->
  <path d="M 55 65 V 95 C 55 106, 145 106, 145 95 V 65" fill="none" stroke="url(#glowGrad)" stroke-width="3" />
  <path d="M 55 95 V 125 C 55 136, 145 136, 145 125 V 95" fill="none" stroke="url(#glowGrad)" stroke-width="3" />

  <!-- Database Stack (Layer 3 - Bottom) -->
  <path d="M 55 125 V 138 C 55 149, 145 149, 145 138 V 125" fill="none" stroke="url(#glowGrad)" stroke-width="3" />

  <!-- Sparkle Star 1 (Top Right) -->
  <path d="M 148 48 Q 148 60 160 60 Q 148 60 148 72 Q 148 60 136 60 Q 148 60 148 48 Z" fill="#10b981" filter="url(#glow)" />
  
  <!-- Sparkle Star 2 (Bottom Left) -->
  <path d="M 46 132 Q 46 140 54 140 Q 46 140 46 148 Q 46 140 38 140 Q 46 140 46 132 Z" fill="#818cf8" filter="url(#glow)" />

  <!-- Center Neural Node -->
  <circle cx="100" cy="98" r="5" fill="#38bdf8" />
  <line x1="80" y1="98" x2="120" y2="98" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3,3" />
</svg>
