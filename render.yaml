services:
  - type: web
    name: dgen-ai-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENV
        value: production
      - key: USE_MONGO_MOCK
        value: true
      - key: JWT_SECRET
        generateValue: true
      - key: APP_NAME
        value: DGen AI
